<!DOCTYPE html>
<html dir="rtl">
<head>
  <base href="/EPI-Supervisor/app/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EPI Supervisor's - نظام إشراف ميداني لحملات التطعيم">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EPI Supervisor's">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <title>EPI Supervisor's</title>

  <style>
    .loading-screen {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #f0f4ff 0%, #ffffff 50%, #f0f4ff 100%);
      font-family: 'Tajawal', 'Cairo', sans-serif; z-index: 9999;
    }
    .loading-screen.hidden { display: none; }
    .loading-logo {
      width: 80px; height: 80px; border-radius: 20px;
      background: linear-gradient(135deg, #1565C0, #1976D2);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px rgba(21,101,192,0.3);
      margin-bottom: 24px;
    }
    .loading-logo svg { width: 48px; height: 48px; fill: white; }
    .loading-spinner {
      width: 40px; height: 40px;
      border: 3px solid #e3e8f0; border-top-color: #1976D2;
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-title { color: #1a1a2e; font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .loading-subtitle { color: #666; font-size: 13px; margin-bottom: 24px; }
    .loading-bar { width: 200px; height: 4px; background: #e3e8f0; border-radius: 2px; overflow: hidden; }
    .loading-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #1976D2, #42A5F5); border-radius: 2px; animation: progress 8s ease-in-out forwards; }
    @keyframes progress { 0% { width: 5%; } 30% { width: 40%; } 60% { width: 70%; } 90% { width: 90%; } 100% { width: 95%; } }
    .loading-hint { color: #999; font-size: 11px; margin-top: 16px; }
    .error-screen {
      display: none;
      padding: 32px;
      text-align: center;
      font-family: 'Tajawal', 'Cairo', sans-serif;
      color: #333;
    }
    .error-screen.visible { display: block; }
    .error-screen h2 { color: #d32f2f; margin-bottom: 12px; }
    .error-screen button {
      margin-top: 16px;
      padding: 10px 24px;
      background: #1976D2;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div class="loading-screen" id="loading">
    <div class="loading-logo">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
    </div>
    <div class="loading-spinner"></div>
    <div class="loading-title">EPI Supervisor</div>
    <div class="loading-subtitle">منصة الإشراف الميداني لحملات التطعيم</div>
    <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    <div class="loading-hint" id="loadProgress">جاري التحميل...</div>
  </div>

  <!-- Error screen (shown if Flutter fails to load) -->
  <div class="error-screen" id="errorScreen">
    <h2>⚠️ خطأ في تحميل التطبيق</h2>
    <p id="errorMessage">حدث خطأ أثناء تحميل التطبيق. يرجى المحاولة مرة أخرى.</p>
    <p id="errorDetail" style="font-size:12px;color:#999;margin-top:12px;"></p>
    <button onclick="location.reload(true)">إعادة المحاولة</button>
  </div>

  <script>
    // Track loading progress
    var progressEl = document.getElementById('loadProgress');
    
    // Global error handler
    window.addEventListener('error', function(e) {
      console.error('Flutter error:', e.message, e.filename, e.lineno);
      var errScreen = document.getElementById('errorScreen');
      var errDetail = document.getElementById('errorDetail');
      if (errScreen) {
        errDetail.textContent = e.filename ? (e.filename + ':' + e.lineno) : '';
        errScreen.style.display = 'block';
      }
      var loading = document.getElementById('loading');
      if (loading) loading.classList.add('hidden');
    });

    window.addEventListener('unhandledrejection', function(e) {
      console.error('Flutter rejection:', e.reason);
      var errScreen = document.getElementById('errorScreen');
      var errDetail = document.getElementById('errorDetail');
      if (errScreen) {
        errDetail.textContent = String(e.reason || '');
        errScreen.style.display = 'block';
      }
      var loading = document.getElementById('loading');
      if (loading) loading.classList.add('hidden');
    });

    // Update progress during load
    if (progressEl) {
      setTimeout(function() { progressEl.textContent = 'تحميل الموارد...'; }, 500);
      setTimeout(function() { progressEl.textContent = 'تجهيز المحرك...'; }, 2000);
      setTimeout(function() { progressEl.textContent = 'الاتصال بالخادم...'; }, 4000);
      setTimeout(function() { progressEl.textContent = 'جاري التهيئة...'; }, 6000);
    }

    // Unregister any stale service workers that may cache old builds
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        registrations.forEach(function(reg) { reg.unregister(); });
      }).catch(function() {});
    }

    // ═══ Loading timeout: if Flutter doesn't start rendering within 20s, show error ═══
    setTimeout(function() {
      var fv = document.querySelector('flutter-view');
      var hasRendered = fv && (
        fv.querySelector('canvas') ||
        fv.querySelector('flt-canvas-container') ||
        fv.querySelector('flt-scene-host') ||
        fv.querySelector('flt-platform-view-slot') ||
        fv.querySelector('flt-semantics-host:not(:empty)') ||
        (fv.shadowRoot && fv.shadowRoot.querySelector('canvas'))
      );
      if (!hasRendered) {
        var loading = document.getElementById('loading');
        var errScreen = document.getElementById('errorScreen');
        var errMsg = document.getElementById('errorMessage');
        if (loading) loading.classList.add('hidden');
        if (errScreen) {
          errScreen.classList.add('visible');
          if (errMsg) errMsg.textContent = 'انتهت مهلة تحميل التطبيق. حاول فتح الموقع في متصفح آخر أو تأكد من دعم WebGL.';
        }
      }
    }, 20000);

    // ═══ Auto-hide loading screen when Flutter renders first frame ═══
    var observer = new MutationObserver(function() {
      var fv = document.querySelector('flutter-view');
      if (fv && (fv.querySelector('canvas') || fv.querySelector('flt-scene-host'))) {
        var loading = document.getElementById('loading');
        if (loading && !loading.classList.contains('hidden')) {
          loading.classList.add('hidden');
        }
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
