name: EPI Supervisor CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.27.4'
  NODE_VERSION: '22'

jobs:
  # ─── Analyze & Test ──────────────────────────────────────
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies (core)
        working-directory: packages/core
        run: flutter pub get

      - name: Install dependencies (shared)
        working-directory: packages/shared
        run: flutter pub get

      - name: Install dependencies (features)
        working-directory: packages/features
        run: flutter pub get

      - name: Install dependencies (mobile)
        working-directory: apps/mobile
        run: |
          flutter pub get
          if [ $? -ne 0 ]; then
            echo "::error::flutter pub get failed in apps/mobile"
            exit 1
          fi

      - name: Generate code (shared)
        working-directory: packages/shared
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format code
        working-directory: apps/mobile
        run: dart format .

      - name: Analyze code
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: apps/mobile
        continue-on-error: true
        run: flutter test 2>&1

  # ─── Admin Web Build & Test ──────────────────────────────
  admin-web:
    name: Admin Web Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/admin-web/package-lock.json

      - name: Install dependencies
        working-directory: apps/admin-web
        run: npm ci

      - name: Run Vitest
        working-directory: apps/admin-web
        continue-on-error: true
        run: npm test

      - name: Build Admin Web
        working-directory: apps/admin-web
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_ZAI_KEY: ${{ secrets.ZAI_API_KEY }}
          VITE_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run build

      - name: Add 404.html for SPA routing
        working-directory: apps/admin-web/dist
        run: cp index.html 404.html

      - name: Add .nojekyll
        working-directory: apps/admin-web/dist
        run: touch .nojekyll

      - name: Upload Admin Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-dist
          path: apps/admin-web/dist/
          retention-days: 7

  # ─── Deploy Admin Web to GitHub Pages ──────────────────
  deploy-admin:
    name: Deploy Admin Web
    runs-on: ubuntu-latest
    needs: admin-web
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Admin Web artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-web-dist
          path: admin-web-dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./admin-web-dist
          publish_branch: gh-pages
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: admin dashboard ${{ github.sha }}'

  # ─── Build APK ───────────────────────────────────────────
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > apps/mobile/android/local.properties

      - name: Clear Gradle cache & flutter clean
        run: |
          rm -rf ~/.gradle/caches/
          cd apps/mobile && flutter clean

      - name: Setup project
        run: |
          cd packages/core && flutter pub get
          cd $GITHUB_WORKSPACE/packages/shared && flutter pub get && dart run build_runner build --delete-conflicting-outputs
          cd $GITHUB_WORKSPACE/packages/features && flutter pub get
          cd $GITHUB_WORKSPACE/apps/mobile && flutter pub get

      - name: Build APK (release)
        working-directory: apps/mobile
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=HF_API_TOKEN=${{ secrets.HF_API_TOKEN }} \
            --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            --dart-define=ZAI_API_KEY=${{ secrets.ZAI_API_KEY }} \
            --dart-define=OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: epi-supervisor-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ─── Build Flutter Web ───────────────────────────────────
  build-web-flutter:
    name: Build Flutter Web (Online-Only)
    runs-on: ubuntu-latest
    needs: analyze
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup project
        run: |
          cd packages/core && flutter pub get
          cd $GITHUB_WORKSPACE/packages/shared && flutter pub get && dart run build_runner build --delete-conflicting-outputs
          cd $GITHUB_WORKSPACE/packages/features && flutter pub get
          cd $GITHUB_WORKSPACE/apps/mobile && flutter pub get

      - name: Build Flutter Web
        working-directory: apps/mobile
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            --dart-define=HF_API_TOKEN=${{ secrets.HF_API_TOKEN }} \
            --dart-define=ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }} \
            --dart-define=ZAI_API_KEY=${{ secrets.ZAI_API_KEY }} \
            --dart-define=OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }} \
            --source-maps

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: epi-supervisor-web
          path: apps/mobile/build/web/
          retention-days: 30

  # ─── Deploy Flutter Web to GitHub Pages ──────────────────
  deploy-flutter-web:
    name: Deploy Flutter Web to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-web-flutter
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: epi-supervisor-web
          path: flutter-web-dist/

      - name: Deploy to gh-pages branch (app/ subfolder)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./flutter-web-dist
          destination_dir: app
          keep_files: true
          commit_message: "deploy: Flutter Web update [skip ci]"

  # ─── Deploy Edge Functions ───────────────────────────────
  deploy-functions:
    name: Deploy Supabase Functions
    runs-on: ubuntu-latest
    needs: [analyze, admin-web]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: '2.91.1'

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "⚠️ Supabase credentials not set, skipping function deployment"
            exit 0
          fi
          supabase link --project-ref $SUPABASE_PROJECT_REF
          supabase secrets set \
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            HF_API_TOKEN=${{ secrets.HF_API_TOKEN }} \
            MIMO_API_KEY=${{ secrets.MIMO_API_KEY }} \
            ZAI_API_KEY=${{ secrets.ZAI_API_KEY }} \
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }} \
          || echo "⚠️ Failed to set some secrets"
          supabase functions deploy ai-chat-v3 --no-verify-jwt || echo "⚠️ Failed to deploy ai-chat-v3"
          for func_dir in supabase/functions/*/; do
            func_name=$(basename "$func_dir")
            if [ "$func_name" != "_shared" ] && [ "$func_name" != "ai-chat-v3" ] && [ "$func_name" != "deno.json" ]; then
              echo "Deploying $func_name..."
              supabase functions deploy "$func_name" --no-verify-jwt || echo "⚠️ Failed to deploy $func_name"
            fi
          done

  # ─── Create Release ──────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-apk]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: epi-supervisor-apk
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: EPI Supervisor v1.0.${{ github.run_number }}
          files: |
            dist/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
