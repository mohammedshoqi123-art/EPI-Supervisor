org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false
org.gradle.parallel=true
org.gradle.caching=true
# Fix: set Kotlin language version to 1.8 globally
# Prevents "Language version 1.6 is no longer supported" error with Kotlin 2.2.0
kotlin.language.version=1.8
kotlin.api.version=1.8
