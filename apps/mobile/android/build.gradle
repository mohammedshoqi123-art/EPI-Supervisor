buildscript {
    ext.kotlin_version = '2.2.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// Force AndroidX core version to fix lStar attribute error in printing package
subprojects {
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.13.1'
            force 'androidx.core:core-ktx:1.13.1'
        }
    }
    // Fix: set Kotlin language version 1.8 for all subprojects
    // This prevents "Language version 1.6 is no longer supported" error
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            try {
                project.android.kotlinOptions {
                    languageVersion = '1.8'
                    apiVersion = '1.8'
                }
            } catch (e) {
                // Some subprojects may not have kotlinOptions — skip them
            }
        }
    }
}
