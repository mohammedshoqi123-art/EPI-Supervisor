name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: '2.91.1'

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy ai-chat-v3
        run: supabase functions deploy ai-chat-v3 --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy all functions
        run: |
          for func_dir in supabase/functions/*/; do
            func_name=$(basename "$func_dir")
            if [ "$func_name" != "_shared" ]; then
              echo "Deploying $func_name..."
              supabase functions deploy "$func_name" --no-verify-jwt || echo "⚠️ Failed to deploy $func_name"
            fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy-migrations:
    name: Deploy Database Migrations
    runs-on: ubuntu-latest
    needs: deploy-functions
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: '2.91.1'

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy database migrations
        run: |
          # ═══ SAFETY GUARD (stage-2) ═══
          # supabase/migrations is intentionally NOT in the repo: the historical
          # migration set predates the live prod schema, and `db push --include-all`
          # would re-apply old migrations against production. Skip cleanly when
          # the folder is absent instead of failing the whole workflow.
          if [ ! -d "supabase/migrations" ]; then
            echo "ℹ️ No supabase/migrations directory in repo — skipping DB migrations (schema is managed directly)"
            exit 0
          fi
          # ⚠️ FIX: Repair orphan migration records before pushing.
          # Production has '055_reduce' registered in schema_migrations without a
          # matching local file (artifact of a previous manual apply). This blocks
          # `supabase db push` with "Remote migration versions not found in local".
          # Mark them as reverted so db push can proceed.
          for v in 055_reduce 20260722000002; do
            echo "Repairing migration $v (marking as reverted)..."
            supabase migration repair --status reverted "$v" 2>&1 || echo "repair $v failed (may not exist) — continuing"
          done

          # Try to push migrations — ignore already-applied ones
          set +e
          OUTPUT=$(supabase db push --include-all 2>&1)
          EXIT_CODE=$?
          set -e
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Migrations deployed successfully"
          elif echo "$OUTPUT" | grep -q "already exists"; then
            echo "⚠️ Some migrations already applied — this is OK"
            echo "Output: $OUTPUT"
          else
            echo "❌ Migration failed:"
            echo "$OUTPUT"
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
