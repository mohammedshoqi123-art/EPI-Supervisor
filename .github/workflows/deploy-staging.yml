name: Deploy to Staging

on:
  push:
    branches: [develop]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'apps/admin-web/**'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "deploy-staging"
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ─── Deploy Edge Functions to Staging ──────────────────────
  deploy-functions:
    name: Deploy Edge Functions (Staging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Staging project
        run: supabase link --project-ref ${{ secrets.STAGING_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy all functions
        run: |
          for func_dir in supabase/functions/*/; do
            func_name=$(basename "$func_dir")
            if [ "$func_name" != "_shared" ]; then
              echo "🚀 Deploying $func_name to staging..."
              supabase functions deploy "$func_name" --no-verify-jwt || echo "⚠️ Failed to deploy $func_name"
            fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ─── Deploy Admin Dashboard to Staging ─────────────────────
  deploy-admin:
    name: Build & Deploy Admin (Staging)
    runs-on: ubuntu-latest
    needs: deploy-functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/admin-web/package-lock.json

      - name: Install dependencies
        working-directory: apps/admin-web
        # Use npm install instead of npm ci to handle cache drift gracefully.
        run: npm install --no-audit --no-fund

      - name: Build (Staging)
        working-directory: apps/admin-web
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_BASE_PATH: /EPI-Supervisor/staging/
        run: npm run build

      - name: Add SPA files
        working-directory: apps/admin-web/dist
        run: |
          cp index.html 404.html
          touch .nojekyll

      - name: Deploy to GitHub Pages (staging subfolder)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/admin-web/dist
          publish_branch: gh-pages
          destination_dir: staging
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: staging admin dashboard ${{ github.sha }}'

  # ─── Run Migrations on Staging ─────────────────────────────
  deploy-migrations:
    name: Deploy DB Migrations (Staging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Staging project
        run: supabase link --project-ref ${{ secrets.STAGING_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations
        run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
