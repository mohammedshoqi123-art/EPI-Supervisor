name: Build APK (Staging)

on:
  # DISABLED — staging builds disabled, use CI/CD workflow
  # workflow_dispatch:
  workflow_dispatch: null

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.27.4'
  NODE_VERSION: '22'

jobs:
  build-apk-staging:
    name: Build Android APK (Staging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > apps/mobile/android/local.properties

      - name: Clear Gradle cache & flutter clean
        run: |
          rm -rf ~/.gradle/caches/
          cd apps/mobile && flutter clean

      - name: Setup project
        run: |
          cd packages/core && flutter pub get
          cd $GITHUB_WORKSPACE/packages/shared && flutter pub get && dart run build_runner build --delete-conflicting-outputs
          cd $GITHUB_WORKSPACE/apps/mobile && flutter pub get

      - name: Mask secrets in logs
        run: |
          echo "::add-mask::${{ secrets.STAGING_SUPABASE_ANON_KEY }}"
          echo "::add-mask::${{ secrets.ENCRYPTION_KEY }}"

      - name: Build APK (Staging)
        working-directory: apps/mobile
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=$STAGING_SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$STAGING_SUPABASE_ANON_KEY \
            --dart-define=APP_ENV=development \
            --dart-define=ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: epi-supervisor-apk-staging
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
